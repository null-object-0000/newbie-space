name: Add Navigation Link

on:
  workflow_dispatch:
    inputs:
      url:
        description: '网站 URL'
        required: true
        type: string
      category:
        description: '现有分类名称'
        required: true
        type: choice
        options:
          - '常用工具'
          - '开放平台'
          - '云服务商'
          - '网络代理'
          - 'AI 对话'
          - 'AI 代理'
          - 'AI 编码'
          - 'AI 服务'
          - 'AI 社区'
        default: '常用工具'
      description:
        description: '网站描述（可选，会自动从网站获取；站点有反爬/人机验证时请手动填写）'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  add-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate inputs
        id: validate
        env:
          INPUT_CATEGORY: ${{ inputs.category }}
        run: |
          # 检查是否选择了分类
          if [ -z "$INPUT_CATEGORY" ]; then
            echo "::error::必须选择现有分类（category）"
            exit 1
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Generate branch name
        id: branch
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          # 从 URL 生成分支名：先转小写再替换非法字符，
          # 否则大写域名会被 sed 逐个替换成一串 "-"
          SLUG=$(printf '%s' "$INPUT_URL" \
            | sed -e 's|^[^/]*//||' -e 's|^www\.||' -e 's|/.*$||' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's|[^a-z0-9]|-|g' -e 's|^-\+||' -e 's|-\+$||')
          # 只截断域名部分，保留时间戳，避免截断后分支重名
          SLUG=${SLUG:0:32}
          echo "name=add-nav-${SLUG}-$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Create branch
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 始终基于远端 main 创建，避免派发分支不是 main 时出错
          git fetch origin main
          git checkout -B "$BRANCH_NAME" origin/main

      - name: Add navigation link
        env:
          NON_INTERACTIVE: 'true'
          INPUT_URL: ${{ inputs.url }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
        run: bun run add-nav

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          git add -A
          git commit -m "chore: 添加导航链接 - ${INPUT_URL}"

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
        run: |
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        id: create-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
        run: |
          # 构建 PR body
          PR_BODY=$(cat <<EOF
          ## 添加导航链接

          - **URL**: ${INPUT_URL}
          - **分类**: ${INPUT_CATEGORY}
          EOF
          )

          if [ -n "${INPUT_DESCRIPTION}" ]; then
            PR_BODY="${PR_BODY}
          - **描述**: ${INPUT_DESCRIPTION}"
          fi

          PR_BODY="${PR_BODY}

          ---

          此 PR 由 GitHub Actions 自动创建。"

          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH_NAME}?expand=1"

          # 使用 GitHub CLI 创建 PR；失败时不中断任务（分支已推送，可手动补 PR）
          if PR_URL=$(gh pr create \
              --title "添加导航链接: ${INPUT_URL}" \
              --body "$PR_BODY" \
              --head "$BRANCH_NAME" \
              --base "main" 2>&1); then
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "pull-request-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "pull-request-url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "✅ PR 创建成功: #$PR_NUMBER"
            echo "PR URL: $PR_URL"
          else
            # 最常见原因：仓库未开启
            # Settings → Actions → General → Workflow permissions
            # → "Allow GitHub Actions to create and approve pull requests"
            echo "::warning::自动创建 PR 失败：$PR_URL"
            {
              echo "### ⚠️ 分支已推送，但自动创建 PR 失败"
              echo ""
              echo '```'
              echo "$PR_URL"
              echo '```'
              echo ""
              echo "请手动创建 PR：[${BRANCH_NAME} → main](${COMPARE_URL})"
              echo ""
              echo "若提示 *GitHub Actions is not permitted to create or approve pull requests*，"
              echo "请到 **Settings → Actions → General → Workflow permissions** 勾选"
              echo "**Allow GitHub Actions to create and approve pull requests** 后重试。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "分支已推送，可手动创建 PR: $COMPARE_URL"
          fi

      - name: Summary
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          {
            echo "## ⚠️ 没有更改"
            echo "没有检测到任何更改。可能的原因："
            echo "- 链接已存在于该分类中"
            echo "- 脚本执行出错（请查看上方日志）"
          } >> "$GITHUB_STEP_SUMMARY"
